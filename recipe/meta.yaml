{% set name = "planarity" %}
{% set version = "1.0.0" %}

package:
  name: python-{{ name }}
  version: {{ version }}

source:
  fn: '{{ name }}-{{ version }}.tar.gz'
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 9129d2429fc54c70a976cdf59b21a9c6a542466cf49747c1bbce1f27d59f4f3e

build:
  number: 0
  skip: true  # [py<310]
  script: "{{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed --no-cache-dir -vvv"

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - cython                                 # [build_platform != target_platform]
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
  host:
    - python
    - pip
    - setuptools
    - cython
    # Use upstream's bundled EAPS 5.0.0.0 until conda-forge provides it.
    # The separately packaged Planarity 3.x/4.x APIs are incompatible.
  run:
    - python

test:
  imports:
    - planarity
    - planarity.classic.planarity
    - planarity.full.graphLib
    - planarity.full.graph
    - planarity.full.g6IterationUtils
  source_files:
    - tests
  requires:
    - pip
    - pytest
    - networkx
  commands:
    - python -m pip check
    - python -m pytest -v tests

about:
  home: https://github.com/graph-algorithms/planarity
  license: BSD-3-Clause
  license_family: BSD
  license_file:
    - LICENSE.txt
    - planarity/c/LICENSE.TXT
  summary: Python bindings for Planarity
  description: |
    Algorithms for graph planarity testing, forbidden subgraph
    finding, and planar embeddings. This provides Python interfaces
    for the Edge Addition Planarity Suite and its graph library at
    https://github.com/graph-algorithms/edge-addition-planarity-suite
  doc_url: https://github.com/graph-algorithms/planarity/wiki
  dev_url: https://github.com/graph-algorithms/planarity

extra:
  recipe-maintainers:
    - gonzalocasas
